<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubConvert Pro - 终极美化版</title>
    <!-- 引入 Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    
    <!-- Tailwind 配置 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#3b82f6', 600: '#2563eb' }
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out',
                        'slide-in-left': 'slideInLeft 0.8s ease-out',
                        'spin-slow': 'spin 8s linear infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideInLeft: {
                            '0%': { opacity: '0', transform: 'translateX(-50px)' },
                            '100%': { opacity: '1', transform: 'translateX(0)' },
                        }
                    }
                }
            }
        }
<script>
    const { createApp, ref, reactive } = Vue

    createApp({
        setup() {
            const showAdvanced = ref(false)
            const customConfigMode = ref(false)

            // 核心后端列表
            const backends = [
                { name: '自营后端', url: 'https://subapi.xunyou.de5.net/sub?' },
                { name: '7li7li', url: 'https://subapi.7li7li.com/sub?' },
                { name: '周润发HK后端', url: 'https://subapi.zrfme.com/sub?' }
            ]

            // 规则配置
            const configs = [
                { name: '定制: FlowCloud', url: 'https://subweb.s3.fr-par.scw.cloud/RemoteConfig/customized/flower.ini' },
                { name: '定制: 不良林 无DNS泄露', url: 'https://cf.buliang0.cf/clash-rules/nodnsleak.ini' }
            ]

            const defaultForm = {
                url: '',
                target: 'clash',
                backend: backends[0].url,
                config: configs[0].url,
                emoji: true,
                udp: false,
                scv: true,
                nodeList: false,
                fdn: false,
                sort: false,
                tfo: false,
                include: '',
                exclude: '',
                rename: '',
                filename: ''
            }

            const form = reactive({ ...defaultForm })

            const options = [
                { key: 'emoji', label: 'Emoji' },
                { key: 'udp', label: 'UDP 转发' },
                { key: 'scv', label: '跳过证书' },
                { key: 'tfo', label: 'TFO (TCP Fast Open)' },
                { key: 'nodeList', label: '输出节点列表' },
                { key: 'fdn', label: '过滤非法节点' },
                { key: 'sort', label: '节点排序' }
            ]

            const resultUrl = ref('')
            const shortUrl = ref('')
            const loadingShort = ref(false)

            const toast = reactive({ show: false, msg: '' })
            let toastTimer = null

            const showToast = (msg) => {
                toast.msg = msg
                toast.show = true
                if (toastTimer) clearTimeout(toastTimer)
                toastTimer = setTimeout(() => {
                    toast.show = false
                }, 2000)
            }

            const resetForm = () => {
                Object.assign(form, { ...defaultForm })
                resultUrl.value = ''
                shortUrl.value = ''
                customConfigMode.value = false
                showAdvanced.value = false
                showToast('设置已重置')
            }

            const safeBase64 = (str) => {
                try {
                    return btoa(str)
                } catch (e) {
                    return btoa(unescape(encodeURIComponent(str)))
                }
            }

            const normalizeMultiUrl = (text) => {
                return text
                    .split(/[\n\r|]+/)
                    .map(line => line.trim())
                    .filter(line => line.length > 0)
                    .join('|')
            }

            // 解析长链接功能
            const parseUrl = async () => {
                const rawUrl = form.url.trim()
                if (!rawUrl || !rawUrl.startsWith('http')) {
                    showToast('请在输入框粘贴有效的转换链接(长链或短链)')
                    return
                }

                try {
                    let finalUrl = rawUrl

                    // 如果不是长链，尝试当短链解析跳转结果
                    if (!rawUrl.includes('target=') && !rawUrl.includes('url=')) {
                        try {
                            const res = await fetch(rawUrl, {
                                method: 'GET',
                                redirect: 'follow'
                            })
                            if (res.url) {
                                finalUrl = res.url
                            }
                        } catch (e) {
                            console.warn('短链解析失败，继续按原链接尝试解析:', e)
                        }
                    }

                    const urlObj = new URL(finalUrl)
                    const params = urlObj.searchParams

                    if (!params.has('target') && !params.has('url')) {
                        showToast('未识别到可解析的配置参数')
                        return
                    }

                    // 1. 还原订阅源链接
                    if (params.has('url')) {
                        form.url = params.get('url').split('|').join('\n')
                    }

                    // 2. 还原基础参数
                    if (params.has('target')) {
                        let target = params.get('target')
                        if (target === 'surge' && params.has('ver')) {
                            target = `surge&ver=${params.get('ver')}`
                        } else if (target === 'surge' && !params.has('ver')) {
                            target = 'surge&ver=4'
                        }
                        form.target = target
                    }

                    if (params.has('config')) {
                        const cfgUrl = params.get('config')
                        form.config = cfgUrl
                        const inList = configs.some(c => c.url === cfgUrl)
                        customConfigMode.value = !inList
                    }

                    // 3. 还原高级筛选
                    form.include = params.get('include') || ''
                    form.exclude = params.get('exclude') || ''
                    form.rename = params.get('rename') || ''
                    form.filename = params.get('filename') || ''

                    // 4. 还原开关
                    const boolMap = {
                        emoji: 'emoji',
                        scv: 'scv',
                        udp: 'udp',
                        tfo: 'tfo',
                        fdn: 'fdn',
                        sort: 'sort',
                        list: 'nodeList'
                    }

                    Object.entries(boolMap).forEach(([paramKey, formKey]) => {
                        if (params.has(paramKey)) {
                            form[formKey] = params.get(paramKey) === 'true'
                        }
                    })

                    // 5. 还原后端
                    const currentBase = urlObj.origin + urlObj.pathname
                    const matchedBackend = backends.find(b => {
                        const backendBase = b.url.replace(/[?&]+$/, '')
                        return currentBase === backendBase || currentBase.startsWith(backendBase)
                    })
                    if (matchedBackend) {
                        form.backend = matchedBackend.url
                    } else {
                        form.backend = currentBase.endsWith('?') ? currentBase : `${currentBase}?`
                    }

                    showAdvanced.value = true
                    resultUrl.value = finalUrl
                    shortUrl.value = ''
                    showToast('配置解析成功！')
                } catch (e) {
                    console.error(e)
                    showToast('解析失败，链接格式错误或短链不可访问')
                }
            }

            const generate = () => {
                if (!form.url.trim()) {
                    showToast('请先输入订阅链接！')
                    return
                }

                shortUrl.value = ''

                const params = new URLSearchParams()

                params.append('target', form.target)

                const processedUrl = normalizeMultiUrl(form.url)
                params.append('url', processedUrl)

                if (form.config) params.append('config', form.config)

                options.forEach(opt => {
                    if (opt.key !== 'nodeList') {
                        params.append(opt.key, String(form[opt.key]))
                    }
                })

                params.append('list', String(form.nodeList))

                if (form.include) params.append('include', form.include)
                if (form.exclude) params.append('exclude', form.exclude)
                if (form.rename) params.append('rename', form.rename)
                if (form.filename) params.append('filename', form.filename)

                let baseUrl = form.backend.trim()
                if (!baseUrl.includes('?')) {
                    baseUrl += '?'
                } else if (!baseUrl.endsWith('?') && !baseUrl.endsWith('&')) {
                    baseUrl += '&'
                }

                resultUrl.value = baseUrl + params.toString()

                setTimeout(() => {
                    const appDom = document.getElementById('app')
                    if (appDom) {
                        window.scrollTo({
                            top: appDom.scrollHeight,
                            behavior: 'smooth'
                        })
                    }
                }, 100)
            }

            const requestShortUrl = async (api, longUrl, useBase64 = false) => {
                const formData = new FormData()
                formData.append('longUrl', useBase64 ? safeBase64(longUrl) : longUrl)

                const res = await fetch(api, {
                    method: 'POST',
                    body: formData
                })

                const text = await res.text()

                let data = null
                try {
                    data = JSON.parse(text)
                } catch (e) {
                    throw new Error(`短链接口返回非 JSON: ${text.slice(0, 200)}`)
                }

                return data
            }

            const getShortUrl = async () => {
                if (!resultUrl.value) {
                    showToast('请先生成长链接')
                    return
                }

                loadingShort.value = true

                try {
                    // 优先 myurl：按原项目逻辑使用 base64 + POST
                    let data = await requestShortUrl(
                        'https://myurl.7li7li.com/short',
                        resultUrl.value,
                        true
                    )

                    if (data.Code === 1 && data.ShortUrl) {
                        shortUrl.value = data.ShortUrl
                        showToast('短链生成成功')
                        return
                    }

                    // 备用 zrf：POST 明文长链
                    data = await requestShortUrl(
                        'https://d.001315.xyz/short',
                        resultUrl.value,
                        false
                    )

                    if (data.Code === 1 && data.ShortUrl) {
                        shortUrl.value = data.ShortUrl
                        showToast('短链生成成功')
                        return
                    }

                    showToast('生成失败: ' + (data.Message || '未知错误'))
                } catch (e) {
                    console.error('短链生成失败:', e)
                    showToast('短链请求失败，请检查接口是否可用或是否存在跨域限制')
                } finally {
                    loadingShort.value = false
                }
            }

            const copy = (text) => {
                if (!text) return

                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(text)
                        .then(() => {
                            showToast('已复制到剪贴板')
                        })
                        .catch(() => {
                            fallbackCopy(text)
                        })
                } else {
                    fallbackCopy(text)
                }
            }

            const fallbackCopy = (text) => {
                const textArea = document.createElement('textarea')
                textArea.value = text
                textArea.style.position = 'fixed'
                textArea.style.left = '-9999px'
                textArea.style.top = '0'
                document.body.appendChild(textArea)
                textArea.focus()
                textArea.select()

                try {
                    document.execCommand('copy')
                    showToast('已复制到剪贴板')
                } catch (err) {
                    showToast('复制失败，请手动复制')
                }

                document.body.removeChild(textArea)
            }

            return {
                backends,
                configs,
                form,
                options,
                resultUrl,
                shortUrl,
                loadingShort,
                toast,
                showAdvanced,
                customConfigMode,
                generate,
                getShortUrl,
                copy,
                resetForm,
                parseUrl
            }
        }
    }).mount('#app')
</script>
</body>
</html>
